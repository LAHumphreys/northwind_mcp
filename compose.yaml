# Dev stack. `docker compose up -d` starts only the database (run the server
# with `go run .` for the tight dev loop); `docker compose --profile full up -d`
# also builds and runs the MCP server in a container.
# Podman: `podman compose ...` works with this file unchanged.
services:
  db:
    build: ./db
    container_name: northwind-db
    ports:
      - "5432:5432"
    volumes:
      - northwind-data:/var/lib/postgresql/data
    healthcheck:
      # -h localhost forces TCP so the check only passes once the entrypoint has
      # finished seeding and restarted Postgres on the network socket.
      test: ["CMD-SHELL", "pg_isready -h localhost -U northwind -d northwind"]
      interval: 5s
      timeout: 3s
      retries: 30

  mcp:
    build: ./mcp-server
    container_name: northwind-mcp
    profiles: ["full"]
    ports:
      - "8080:8080"
    environment:
      NORTHWIND_DB_HOST: db
      NORTHWIND_DB_PORT: "5432"
      NORTHWIND_DB_USER: northwind
      NORTHWIND_DB_PASSWORD: northwind
      NORTHWIND_DB_NAME: northwind
      MCP_HTTP_ADDR: ":8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  northwind-data:
